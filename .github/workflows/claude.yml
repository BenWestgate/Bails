name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
         contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@86d88e619d8e6caf07b5c3944dd14f441c533718 # v1
        with:
          anthropic_federation_rule_id: fdrl_014L7wAToKxrpPbEnV1LNSZY
          anthropic_organization_id: 4729edfa-40b8-4736-b2fe-699027866dab
          anthropic_service_account_id: svac_01EXrLucX9Ebczg93cUi8Aqy
          anthropic_workspace_id: wrkspc_01CrVpnUanh3JtdHnoEMH5Hm
          additional_permissions: |
            actions: read
