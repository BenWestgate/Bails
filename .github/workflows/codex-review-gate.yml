            const shouldCheckpointDefaultPush =
              context.eventName === 'push' &&
              context.ref === `refs/heads/${defaultBranch}`;
            if (
              shouldCheckpointDefaultPush ||
              JSON.stringify(state) !== JSON.stringify(originalState)
            ) {
              await writeState(state);
            }

            const waitUntil = state.probe?.requested_at
              ? `Codex probe in flight since ${state.probe.requested_at}`
              : state.next_probe_at
                ? `Next Codex probe: ${state.next_probe_at}`
                : 'No Codex retry is currently scheduled.';
            core.notice(waitUntil);
